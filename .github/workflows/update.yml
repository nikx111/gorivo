# Всеки ден около обяд: цени от Fuelo, петрол, оценка за утре, ntfy и обновено табло.
# Едно пускане харчи около 40 от 100-те дневни заявки на Fuelo; повторно пускане в същия ден ползва кеша.
name: update
on:
  schedule:
    - cron: '17 9 * * *'   # около обяд в България
    - cron: '47 13 * * *'  # резерва, ако GitHub пропусне първото; ползва кеша, без нови заявки към Fuelo
  workflow_dispatch:
permissions:
  contents: write
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy openpyxl
      - run: node --test test/*.test.mjs
      - run: node update.mjs
        env:
          FUELO_API_KEY: ${{ secrets.FUELO_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898+github-actions[bot]@users.noreply.github.com'
          git add data docs/data
          git diff --cached --quiet || git commit -m "Данни за $(TZ=Europe/Sofia date +%F)"
          git push
