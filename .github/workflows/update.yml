# Основно се пуска от Synology NAS-а всеки ден в 10:00 (задача Grigorivo, workflow_dispatch); графикът тук е резерва.
# Всеки ден: цени от Fuelo, петрол, оценка за утре, ntfy и обновено табло.
# Едно пускане с нови цени харчи около 35 от 100-те дневни заявки на Fuelo; останалите ползват кеша.
name: update
on:
  schedule:
    - cron: '17 9 * * *'   # резерва: тегли от Fuelo само ако NAS-ът не е пускал 26 часа
    - cron: '47 13 * * *'  # втора резерва; GitHub често ги пуска с часове закъснение
  workflow_dispatch:
permissions:
  contents: write
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy openpyxl
      - run: node --test test/*.test.mjs
      - run: node update.mjs
        env:
          FUELO_API_KEY: ${{ secrets.FUELO_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          RUN_KIND: ${{ github.event_name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898+github-actions[bot]@users.noreply.github.com'
          git add data docs/data
          git diff --cached --quiet || git commit -m "Данни за $(TZ=Europe/Sofia date +%F)"
          # Ако междувременно е качено нещо друго, push се отказва; без повторен опит кешът на Fuelo
          # нямаше да се запише и следващото пускане щеше да тегли цените отново
          ok=0; for i in 1 2 3; do git pull --rebase -q && git push -q && ok=1 && break; sleep 5; done; test $ok = 1
